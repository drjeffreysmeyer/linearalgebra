</h2>
<div class="para">An infinite set <span class="process-math">\(X\)</span> is <dfn class="terminology">countably infinite</dfn> if the exists a bijection <span class="process-math">\(f:X\to \Z_+\text{.}\)</span> If no such bijection exists, then <span class="process-math">\(X\)</span> is <dfn class="terminology">uncountable</dfn>. A set which is finite or countably infinite is <dfn class="terminology">countable</dfn>.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#Def-infinites-2-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
