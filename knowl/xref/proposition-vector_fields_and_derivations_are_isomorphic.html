<div class="para logical">
<div class="para">If <span class="process-math">\(M\)</span> is a smooth manifold, then the map</div>
<div class="displaymath process-math">

D: \mathfrak{X}(M) \to \mathrm{Der}(C^\infty(M))
\end{equation*}
</div>
<div class="para">defined by</div>
<div class="displaymath process-math">
\begin{equation*}
D(X) = D_X
\end{equation*}
</div>
<div class="para">is an isomorphism of vector spaces.</div>
