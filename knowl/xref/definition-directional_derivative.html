<span class="type">Definition</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">1.4.2</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title">Directional Derivative.</span>
</h2>
<div class="para logical">
<div class="para">If <span class="process-math">\(M\)</span> is a smooth manifold and <span class="process-math">\(X \in \mathfrak{X}(M)\text{,}\)</span> then the <dfn class="terminology">directional derivative</dfn> <span class="process-math">\(D_X\)</span> is a linear map from <span class="process-math">\(C^\infty(M)\)</span> to <span class="process-math">\(C^\infty(M)\)</span> defined by</div>
<div class="displaymath process-math">
\begin{equation*}
D_X(f)(p) = df_p(X_p).
\end{equation*}
</div>
